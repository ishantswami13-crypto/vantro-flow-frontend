<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background: pure black -->
  <rect width="100" height="100" rx="22" fill="#000000"/>

  <!-- Inner border: subtle white edge -->
  <rect x="1" y="1" width="98" height="98" rx="21"
        stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>

  <!-- Left arm: bold calligraphic bezier, white -->
  <path d="M 18,19 C 10,40 28,64 50,81"
        stroke="white" stroke-width="13.5" stroke-linecap="round" fill="none"/>

  <!-- Right arm: thinner, semi-white -->
  <path d="M 82,19 C 90,40 72,64 50,81"
        stroke="rgba(255,255,255,0.75)" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Vertex dot -->
  <circle cx="50" cy="81" r="3.5" fill="white"/>
</svg>
