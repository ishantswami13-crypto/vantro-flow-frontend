<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A6FFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Inner shine overlay (top-left highlight) -->
  <rect width="100" height="100" rx="22" fill="url(#shine)"/>

  <!-- Stylized V mark — thick left stroke (bold downstroke), thinner right (upstroke) -->
  <!-- Left arm -->
  <line x1="19" y1="24" x2="50" y2="76" stroke="white" stroke-width="13.5" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="81" y1="24" x2="50" y2="76" stroke="rgba(255,255,255,0.88)" stroke-width="9.5" stroke-linecap="round"/>

  <!-- Small accent dot at the vertex — collection point -->
  <circle cx="50" cy="76" r="4" fill="rgba(255,255,255,0.5)"/>
</svg>
