name: Desktop

# Starlane desktop (desktop/, Tauri) and the shared contracts it is built on.
#   check    every PR/push touching them: typecheck, web build, Rust tests
#   windows  builds the installable Windows app (NSIS .exe + .msi) and uploads
#            it as a workflow artifact; on a desktop-v* tag it also publishes a
#            GitHub Release (+ latest.json for in-app updates when signing is set up)
#
# Signing is optional and configured only through secrets/variables:
#   secrets.TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)  updater signing key
#   vars.TAURI_UPDATER_PUBKEY                        its public half
#   secrets.WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD
# Without them the installer builds and runs, but is unsigned (SmartScreen
# warning) and cannot update itself.

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["desktop-v*"]
    paths: ["desktop/**", "packages/contracts/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "packages/contracts/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - name: Typecheck + web build
        run: npm run build
      - name: Linux system libraries for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - name: Rust tests (deep links, keyring allowlist)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write   # only used on desktop-v* tags to publish the release
    defaults: { run: { working-directory: desktop, shell: bash } }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: npm ci

      - name: Import Windows code-signing certificate (if provided)
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output "No certificate secret: the build will be unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Configure signing and updates
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: node scripts/configure-release.mjs

      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: npx tauri build --bundles nsis,msi

      # Install the real installers the way a user would, start the installed
      # app, check it stays up (no crash on start: WebView2, keyring and
      # plugins all load), then uninstall. Proves the artifacts install, not
      # just that they were produced.
      - name: Installer smoke test (NSIS per-user, then MSI)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Launch([string]$exe) {
            if (-not (Test-Path $exe)) { throw "Installed app not found at $exe" }
            Write-Output "Launching $exe"
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 15
            if ($p.HasExited) { throw "Starlane exited within 15 s (exit code $($p.ExitCode))" }
            Write-Output "Starlane is running (pid $($p.Id)) from $exe"
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Output "NSIS installer: $($nsis.Name) ($([math]::Round($nsis.Length / 1MB, 1)) MB)"
          $proc = Start-Process -FilePath $nsis.FullName -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "NSIS installer exited with $($proc.ExitCode)" }
          # The app binary is named after the Cargo package (starlane-desktop.exe);
          # take whatever non-uninstaller .exe the installer put in the Starlane folder.
          function Find-App([string[]]$dirs) {
            foreach ($d in $dirs) {
              if (-not (Test-Path $d)) { continue }
              $e = Get-ChildItem $d -Filter *.exe | Where-Object { $_.Name -notmatch '^uninstall' } | Select-Object -First 1
              if ($e) { return $e }
            }
            return $null
          }
          $app = Find-App @("$env:LOCALAPPDATA\Starlane", "$env:LOCALAPPDATA\Programs\Starlane", "$env:ProgramFiles\Starlane")
          if (-not $app) { Get-ChildItem "$env:LOCALAPPDATA" -Directory | Select-Object -ExpandProperty Name; throw 'NSIS install produced no Starlane executable' }
          Test-Launch $app.FullName
          $dir = $app.DirectoryName
          $un = Get-ChildItem $dir -Filter 'uninstall*.exe' | Select-Object -First 1
          if (-not $un) { throw 'No uninstaller next to the installed app' }
          Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait
          # NSIS uninstallers re-launch a temp copy and return early; poll.
          for ($i = 0; $i -lt 30 -and (Test-Path $app.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app.FullName) { throw 'NSIS uninstall left the app behind' }
          Write-Output 'NSIS: installed, launched, uninstalled.'

          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Write-Output "MSI: $($msi.Name) ($([math]::Round($msi.Length / 1MB, 1)) MB)"
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$env:RUNNER_TEMP\msi.log`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 40; throw "msiexec exited with $($proc.ExitCode)" }
          $exe = Find-App @("$env:ProgramFiles\Starlane", "${env:ProgramFiles(x86)}\Starlane", "$env:LOCALAPPDATA\Programs\Starlane")
          if (-not $exe) { throw 'MSI install produced no Starlane executable' }
          Test-Launch $exe.FullName
          $proc = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "MSI uninstall exited with $($proc.ExitCode)" }
          Write-Output 'MSI: installed, launched, uninstalled.'

      - name: Publish release (desktop-v* tags)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Starlane ${{ github.ref_name }}
          releaseBody: See the assets below to install Starlane for Windows.
          releaseDraft: true
          includeUpdaterJson: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
          args: --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: starlane-windows-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error
          retention-days: 30
